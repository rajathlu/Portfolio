<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Factory Production Management">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1e3f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pbg)"/>
  <!-- factory roofline -->
  <g fill="#16335f" stroke="#4f86d6" stroke-width="2">
    <path d="M90 250 v-70 l40 30 v-30 l40 30 v-30 l40 30 v70 z"/>
  </g>
  <!-- chimney -->
  <rect x="100" y="150" width="18" height="30" fill="#4f86d6"/>
  <!-- gear -->
  <g transform="translate(420 150)" fill="#7fb2ff">
    <circle r="38" fill="#16335f" stroke="#7fb2ff" stroke-width="3"/>
    <circle r="14" fill="#0b1e3f" stroke="#7fb2ff" stroke-width="3"/>
    <g>
      <rect x="-6" y="-50" width="12" height="16" rx="2"/>
      <rect x="-6" y="34" width="12" height="16" rx="2"/>
      <rect x="-50" y="-6" width="16" height="12" rx="2"/>
      <rect x="34" y="-6" width="16" height="12" rx="2"/>
    </g>
  </g>
  <!-- conveyor belt -->
  <rect x="80" y="280" width="440" height="22" rx="6" fill="#0b1e3f" stroke="#4f86d6" stroke-width="2"/>
  <g fill="#7fb2ff">
    <rect x="120" y="258" width="28" height="22" rx="3"/>
    <rect x="200" y="258" width="28" height="22" rx="3"/>
    <rect x="280" y="258" width="28" height="22" rx="3"/>
    <rect x="360" y="258" width="28" height="22" rx="3"/>
  </g>
  <circle cx="100" cy="312" r="12" fill="#16335f" stroke="#4f86d6" stroke-width="2"/>
  <circle cx="500" cy="312" r="12" fill="#16335f" stroke="#4f86d6" stroke-width="2"/>
  <!-- dashboard bars -->
  <g fill="#5ad1a6">
    <rect x="300" y="120" width="14" height="40" rx="2"/>
    <rect x="320" y="100" width="14" height="60" rx="2"/>
    <rect x="340" y="80" width="14" height="80" rx="2"/>
  </g>
  <text x="300" y="375" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">Production Management</text>
</svg>
