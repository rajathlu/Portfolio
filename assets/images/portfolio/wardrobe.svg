<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="AI Wardrobe">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5bd0"/>
      <stop offset="1" stop-color="#2b2150"/>
    </linearGradient>
    <linearGradient id="wcloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wbg)"/>
  <!-- wardrobe cabinet -->
  <rect x="180" y="70" width="240" height="270" rx="10" fill="#1c1638" stroke="#8a7ce0" stroke-width="3"/>
  <line x1="300" y1="70" x2="300" y2="340" stroke="#8a7ce0" stroke-width="3"/>
  <circle cx="290" cy="205" r="6" fill="#ffd27a"/>
  <circle cx="310" cy="205" r="6" fill="#ffd27a"/>
  <!-- hanging shirt left -->
  <path d="M210 110 l25 -15 l25 15 l-8 22 l-9 -6 v60 h-16 v-60 l-9 6 z" fill="url(#wcloth)"/>
  <!-- hanging dress right -->
  <path d="M335 110 l25 -15 l25 15 l-10 20 l20 75 h-70 l20 -75 z" fill="#7fd4c1"/>
  <!-- AI sparkle node -->
  <g transform="translate(300 200)">
    <circle cx="0" cy="0" r="0" fill="none"/>
  </g>
  <!-- AI badge -->
  <circle cx="300" cy="200" r="46" fill="#ffffff" opacity="0.08"/>
  <circle cx="300" cy="200" r="30" fill="#0f0c22" stroke="#7fd4c1" stroke-width="2"/>
  <text x="300" y="208" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#7fd4c1" text-anchor="middle">AI</text>
  <!-- sparkles -->
  <g fill="#ffd27a">
    <path d="M150 150 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M450 250 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z"/>
  </g>
  <text x="300" y="375" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">AI Wardrobe</text>
</svg>
